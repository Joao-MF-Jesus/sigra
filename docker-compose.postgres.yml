services:
  postgres:
    image: postgres:16
    container_name: sigra_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sigra_dev}
      POSTGRES_USER: ${POSTGRES_USER:-sigra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sigra_dev_only}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
      PGTZ: UTC
      TZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - sigra_pgdata:/var/lib/postgresql/data
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sigra} -d ${POSTGRES_DB:-sigra_dev}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  sigra_pgdata:
