name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      build_academic_release:
        description: "Gerar a cópia acadêmica controlada"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  backend-sqlite:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
      SIGRA_CANONICAL_SQLITE_PATH: "${{ github.workspace }}/tmp/sigra-ci-source.db"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Restore pinned offline Revision6 inputs
        run: python scripts/prepare_build_inputs.py --output dist/ci-revision6 --github-env "$GITHUB_ENV"
      - name: Build reproducible SQLite migration fixture
        run: python scripts/bootstrap_ci_sqlite.py
      - name: Run complete backend suite
        run: python -m unittest discover -s backend/tests -t backend -v
      - name: Run candidate cache, receipt and mounted registration regressions
        env:
          PYTHONPATH: "${{ github.workspace }}/backend:${{ github.workspace }}"
          DATABASE_ENV: test
          DATABASE_URL: "sqlite:///:memory:"
          DATABASE_BOOTSTRAP_SCHEMA: "false"
          FIPE_AUTO_REFRESH: "false"
          PYTHON_DOTENV_DISABLED: "1"
        run: >-
          python -m pytest -q
          backend/tests/test_catalog_cache.py
          backend/tests/test_compact_catalog_audit.py
          backend/tests/test_trial_receipt_projection.py
          backend/tests/test_personalization_price_message.py
          backend/tests/test_registration_mounted_contract.py
      - name: Validate immutable regression fixtures
        run: python -m unittest discover -s backend/tests -t backend -p "test_*regression_fixture.py" -v
      - name: Confirm motorcycle recommender remains unavailable
        working-directory: backend
        run: python -m unittest tests.test_api.ApiTest.test_financing_reverse_compare_validation_and_motorcycle_501 -v
      - name: Validate motorcycle pilot tooling
        run: |
          python scripts/validate_motorcycle_pilot_data.py backend/data/templates/motorcycle_pilot_collection_v1.csv
          python scripts/import_motorcycle_pilot_data.py backend/data/templates/motorcycle_pilot_collection_v1.csv --dry-run
      - name: Compile Python sources
        run: python -m compileall -q backend/app backend/tests scripts

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Build public homologation frontend
        working-directory: frontend
        env:
          VITE_API_URL: https://sigra-api-homolog.example.invalid
          VITE_PUBLIC_DEMO_MODE: "true"
        run: npm run build
      - name: Audit critical vulnerabilities
        working-directory: frontend
        run: npm audit --audit-level=critical

  reproducible-preview-function:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/preview-builder/package-lock.json
      - name: Install public build dependencies
        run: |
          python -m pip install -r backend/requirements.txt uv==0.10.11
          npm ci --prefix tools/preview-builder --ignore-scripts
      - name: Validate original provenance and deterministic assembly
        run: |
          python scripts/verify_published_sources.py
          python -m unittest discover -s backend/tests -t backend -p test_reproducible_preview_build.py -v
          python -m unittest discover -s backend/tests -t backend -p test_private_build_configuration.py -v
          python scripts/build_preview_project.py --output dist/preview-project
      - name: Build effective frontend and official Linux Python Function
        run: |
          npm ci --prefix dist/preview-project/application/frontend --ignore-scripts
          node dist/preview-project/application/deploy/build_vercel.mjs
          node tools/preview-builder/build.mjs dist/preview-project dist/preview-function
          python scripts/validate_preview_function.py dist/preview-function
      - name: Upload public build receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-preview-build-receipts
          path: |
            dist/preview-project/build-receipt.json
            dist/preview-function/builder-receipt.json
            dist/preview-function/validation.json
          if-no-files-found: error

  e2e:
    runs-on: ubuntu-latest
    needs: [backend-sqlite, frontend]
    env:
      PYTHONPATH: ${{ github.workspace }}
      SIGRA_E2E_BACKEND_PORT: "8010"
      SIGRA_E2E_FRONTEND_PORT: "4183"
      SIGRA_E2E_RUN_ID: "${{ github.run_id }}-${{ github.run_attempt }}"
      CORS_ALLOWED_ORIGINS: "http://127.0.0.1:4183"
      FIPE_AUTO_REFRESH: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        working-directory: frontend
        run: npm run test:e2e
      - name: Validate vehicle photo states in cards and details
        working-directory: frontend
        run: node node_modules/playwright/cli.js test --config=playwright.photos.config.js
      - name: Upload E2E diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-diagnostics
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  backend-postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sigra_integration
          POSTGRES_USER: sigra
          POSTGRES_PASSWORD: sigra_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sigra -d sigra_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PYTHONPATH: ${{ github.workspace }}
      DATABASE_ENV: integration
      DATABASE_URL: postgresql+psycopg://sigra@127.0.0.1:5432/sigra_integration
      TEST_POSTGRESQL_URL: postgresql+psycopg://sigra@127.0.0.1:5432/sigra_integration
      SIGRA_RUN_POSTGRES_TESTS: "1"
      DATABASE_WAIT_TIMEOUT_SECONDS: "60"
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: sigra
      PGPASSWORD: sigra_ci_only
      PGDATABASE: sigra_integration
      FIPE_AUTO_REFRESH: "false"
      CORS_ALLOWED_ORIGINS: "http://127.0.0.1:4183"
      SIGRA_CANONICAL_SQLITE_PATH: "${{ github.workspace }}/tmp/sigra-ci-source.db"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Wait for PostgreSQL
        run: python scripts/wait_for_database.py --require-postgresql
      - name: Restore pinned offline Revision6 inputs
        run: python scripts/prepare_build_inputs.py --output dist/ci-revision6 --github-env "$GITHUB_ENV"
      - name: Create isolated PostgreSQL databases
        run: |
          for database in sigra_dev sigra_migration_test; do
            if ! psql --dbname=postgres --tuples-only --no-align \
              --command="SELECT 1 FROM pg_database WHERE datname = '${database}'" \
              | grep -q '^1$'; then
              createdb "${database}"
            fi
          done
      - name: Validate Alembic cycle in disposable database
        env:
          DATABASE_URL: postgresql+psycopg://sigra@127.0.0.1:5432/sigra_migration_test
        run: |
          python -m alembic -c backend/alembic.ini upgrade head
          python -m alembic -c backend/alembic.ini current
          python -m alembic -c backend/alembic.ini downgrade base
          python -m alembic -c backend/alembic.ini upgrade head
          python -m alembic -c backend/alembic.ini current
      - name: Upgrade integration schema with Alembic
        run: python -m alembic -c backend/alembic.ini upgrade head
      - name: Validate PostgreSQL schema
        run: python scripts/validate_postgresql_schema.py
      - name: Build reproducible SQLite migration fixture
        run: python scripts/bootstrap_ci_sqlite.py
      - name: Export and validate reproducible SQLite data
        run: |
          python scripts/export_sqlite_data.py \
            --output dist/data-migration/sqlite-export-v1 \
            --overwrite
          python scripts/validate_database_export.py \
            dist/data-migration/sqlite-export-v1
      - name: Dry-run PostgreSQL import
        run: >-
          python scripts/import_postgresql_data.py
          dist/data-migration/sqlite-export-v1
          --output dist/data-migration/postgresql-import-dry-run.json
      - name: Import canonical data into PostgreSQL
        run: >-
          python scripts/import_postgresql_data.py
          dist/data-migration/sqlite-export-v1
          --confirm-import
          --output dist/data-migration/postgresql-import-report.json
      - name: Compare SQLite and PostgreSQL contents
        run: >-
          python scripts/compare_database_contents.py
          --output dist/data-migration/database-comparison.json
      - name: Prove PostgreSQL integration tests are active
        run: >-
          python -m unittest
          tests.test_postgresql_integration.PostgreSQLIntegrationEnvironmentTest.test_postgresql_integration_environment_is_active
          -v
        working-directory: backend
      - name: Run complete backend suite with PostgreSQL integration enabled
        run: >-
          env -u DATABASE_URL -u DATABASE_ENV
          python -m unittest discover -s backend/tests -t backend -v
      - name: Report migration status
        run: python scripts/check_migration_status.py

  package-validation:
    runs-on: ubuntu-latest
    needs: [backend-sqlite, backend-postgresql, frontend, e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package validation dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Generate technical and academic validation packages
        run: |
          python scripts/create_clean_package.py --output dist/package-validation/SIGRA-technical.zip
          python scripts/build_academic_release.py --output dist/package-validation/SIGRA-academic.zip
      - name: Validate release exclusions and integrity metadata
        run: |
          python -m unittest discover -s backend/tests -t backend -p "test_motorcycle_stabilization_v031.py" -v
          python -m unittest discover -s backend/tests -t backend -p "test_stabilization_patch.py" -v

  academic-release:
    if: github.event_name == 'workflow_dispatch' && inputs.build_academic_release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build controlled academic package
        run: python scripts/build_academic_release.py
      - name: Upload academic package and integrity files
        uses: actions/upload-artifact@v4
        with:
          name: sigra-academic-release
          path: |
            dist/academic/*.zip
            dist/academic/*.sha256
            dist/academic/*.report.json
          if-no-files-found: error
